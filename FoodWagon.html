<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodWagon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./FoodWagon.css">
</head>

<body>
    <nav class="nav1">
        <div class="logo">
            <img src="D:\Mask Group.png" alt="">

            <span class="s1">Food</span>
            <span class="s2">waGon</span>
        </div>

        <div class="location">
            <span class="s3">Deliver to:</span>
            <img src="D:\map-marker-alt.png" alt="">
            <span class="s4">Current Location</span>
            <span class="s5">Muhamadpur Bus Stand, Dhaka.</span>

        </div>

        <div class="search">
            <img src="D:\Search.png" alt="image" width="20xp" height="20px">
            <span class="s6">Search Food</span>
            <button class="login">
                <img src="D:\user.png" alt="image" width="13px" height="15px">
                <span class="s7">Login</span>
            </button>
        </div>
    </nav>


    <div class="herosection">
        <div class="starving">
            <span class="s8">Are You starving?</span>
            <span class="s9">Within a few clicks, find meals that are accessible near you.</span>
            <br>
            <div class="pickup">
                <div class="rider">
                    <button class="b1">
                        <img src="D:\Icon.png" alt="">
                        Delivery</button>
                    <button class="b2">
                        <img src="D:\Icon (1).png" alt="">
                        Pickup</button>
                </div>
                <div class="findfood">
                    <div class="findfood2">
                        <img src="D:\Icon (4).png" alt="" class="img1">
                        <span class="s10">Enter your addreas</span>
                    </div>
                    <button class="findfood3">
                        <img src="D:\Icon (3).png" alt="">
                        <span class="s11">Find Food</span>
                    </button>

                </div>
            </div>
        </div>

        <div class="egg"></div>
    </div>
</body>

</html>
